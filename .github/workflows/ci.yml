# Pipeline CI/CD MLOps - Prediction des impayes Telecom (Nigeria)
# Automatise l'integration continue (CI) et la livraison continue (CD).

name: CI-CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  ci-qualite-tests:
    name: 1. CI - Qualite du code et Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Configuration de Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install xgboost-cpu==3.4.1
          pip install pytest httpx ruff

      - name: Verification du style et linting (ruff)
        run: ruff check src/ pipeline/ tests/

      - name: Execution de la suite de tests (pytest)
        run: pytest -v

  cd-docker:
    name: 2. CD - Construction, Validation et Publication Docker
    needs: [ci-qualite-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image Docker
        run: |
          docker build -t default-risk-api:test .

      - name: Test de fonctionnement du conteneur (Smoke Test)
        run: |
          # Demarrage du conteneur en arriere-plan
          docker run -d --name api-smoke-test -p 8000:8000 default-risk-api:test
          
          # Attente du demarrage du serveur
          sleep 5
          
          # Verification de la sonde de sante
          curl -f http://127.0.0.1:8000/health || (docker logs api-smoke-test && exit 1)
          
          # Verification de l'observabilite Prometheus
          curl -f http://127.0.0.1:8000/metrics || (docker logs api-smoke-test && exit 1)
          
          # Nettoyage
          docker rm -f api-smoke-test

      - name: Connexion a GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push de l'image sur GitHub Container Registry (GHCR)
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag default-risk-api:test ghcr.io/${REPO_LOWER}:latest
          docker tag default-risk-api:test ghcr.io/${REPO_LOWER}:${{ github.sha }}
          docker push ghcr.io/${REPO_LOWER}:latest
          docker push ghcr.io/${REPO_LOWER}:${{ github.sha }}

      - name: Connexion et Push optionnel vers Docker Hub
        if: env.DOCKERHUB_USER != '' && env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker tag default-risk-api:test ${{ secrets.DOCKERHUB_USERNAME }}/default-risk-api:latest
          docker tag default-risk-api:test ${{ secrets.DOCKERHUB_USERNAME }}/default-risk-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/default-risk-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/default-risk-api:${{ github.sha }}
